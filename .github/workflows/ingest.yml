name: nightly-ingest

on:
  schedule:
    # 02:00 UTC every day
    - cron: "0 2 * * *"
  workflow_dispatch:        # allow manual trigger from the Actions tab
    inputs:
      since:
        description: "How far back to ingest (e.g. 24h, 6h)"
        required: false
        default: "24h"
      limit:
        description: "Max articles to process (blank = no limit)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pipeline

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Install system deps
        run: |
          # spaCy transformer model needs these
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            build-essential

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download spaCy model
        run: python -m spacy download en_core_web_trf

      - name: Run ingest
        env:
          POSTGRES_URL:   ${{ secrets.POSTGRES_URL }}
          NEO4J_URI:      ${{ secrets.NEO4J_URI }}
          NEO4J_USER:     ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:   gemini-2.0-flash
          LOG_LEVEL:      INFO
          SENTRY_DSN:     ${{ secrets.SENTRY_DSN }}
        run: |
          SINCE="${{ inputs.since || '24h' }}"
          LIMIT="${{ inputs.limit }}"
          if [ -n "$LIMIT" ]; then
            python -m pipeline.run --since "$SINCE" --limit "$LIMIT"
          else
            python -m pipeline.run --since "$SINCE"
          fi

      - name: Sync Neo4j
        env:
          POSTGRES_URL:   ${{ secrets.POSTGRES_URL }}
          NEO4J_URI:      ${{ secrets.NEO4J_URI }}
          NEO4J_USER:     ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: python -m pipeline.sync_graph --incremental

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log-${{ github.run_id }}
          path: pipeline/*.log
          if-no-files-found: ignore
          retention-days: 7
